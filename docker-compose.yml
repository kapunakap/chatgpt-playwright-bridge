name: playwright-mcp-aws

services:
  playwright:
    image: ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:v0.0.75}
    init: true
    command:
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - playwright:8931,playwright,localhost:8931,localhost,127.0.0.1:8931,127.0.0.1
      - --shared-browser-context
      - --user-data-dir
      - /data/profile
      - --output-dir
      - /data/output
    expose:
      - "8931"
    shm_size: 512m
    volumes:
      - ${PLAYWRIGHT_DATA_DIR:-/var/lib/playwright-mcp-aws}:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8931/mcp').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp

  tunnel:
    image: ${TUNNEL_CLIENT_IMAGE:-ghcr.io/openai/tunnel-client@sha256:c22610c17e4f624fa8114fb93d7d5df915ce7a4d3fe115a6c41ba4677ea54819}
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:?OPENAI_TUNNEL_ID is required}
      MCP_SERVER_URL: http://playwright:8931/mcp
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    command:
      - --control-plane.api-key=file:/run/secrets/openai_runtime_api_key
    secrets:
      - openai_runtime_api_key
    depends_on:
      playwright:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/readyz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks:
      - mcp

networks:
  mcp:
    driver: bridge

secrets:
  openai_runtime_api_key:
    file: ${OPENAI_RUNTIME_API_KEY_FILE:?OPENAI_RUNTIME_API_KEY_FILE is required}
