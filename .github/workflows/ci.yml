name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime regression tests and embedded file parity
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.cjs
          python3 scripts/sync-template.py --check

      - name: Compose config
        run: |
          cp .env.example .env
          export OPENAI_RUNTIME_API_KEY_FILE="${RUNNER_TEMP}/openai_runtime_api_key"
          printf 'not-a-real-key\n' > "${OPENAI_RUNTIME_API_KEY_FILE}"
          docker compose --env-file .env config >/dev/null

      - name: CloudFormation lint
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/cloudformation.yaml

      - name: Reject obvious committed secrets
        run: |
          if git grep -nE \
            '(sk-[A-Za-z0-9_-]{20,}|OPENAI_(API|ADMIN)_KEY=.+|CONTROL_PLANE_API_KEY=.+)' \
            -- . ':(exclude).env.example' ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential secret committed.' >&2
            exit 1
          fi
