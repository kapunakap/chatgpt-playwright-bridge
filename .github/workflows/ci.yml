name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Compose config
        run: |
          cp .env.example .env
          mkdir -p /run/playwright-mcp-aws
          printf 'not-a-real-key\n' > /run/playwright-mcp-aws/openai_runtime_api_key
          docker compose --env-file .env config >/dev/null

      - name: CloudFormation lint
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/cloudformation.yaml

      - name: Reject obvious committed secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='.env.example' \
            '(sk-[A-Za-z0-9_-]{20,}|OPENAI_(API|ADMIN)_KEY=.+|CONTROL_PLANE_API_KEY=.+)' .; then
            echo 'Potential secret committed.' >&2
            exit 1
          fi
