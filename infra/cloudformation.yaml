            "/tmp/playwright-mcp-aws/viewer/index.html":
              content: "<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Playwright Live View</title><link rel=\"stylesheet\" href=\"/style.css\"><header><strong>Playwright Live View</strong><span id=\"status\">Connecting\u2026</span><label><input type=\"checkbox\" id=\"control\"> Enable control</label><label>Stream <select id=\"quality\" class=\"browser-control\" disabled><option value=\"faster\">Faster</option><option value=\"sharper\">Sharper</option></select></label><button id=\"paste\">Paste text</button></header><form id=\"navigation\" aria-label=\"Browser navigation\"><button type=\"button\" id=\"back\" class=\"browser-control\" disabled aria-label=\"Back\">\u2190</button><button type=\"button\" id=\"forward\" class=\"browser-control\" disabled aria-label=\"Forward\">\u2192</button><button type=\"button\" id=\"reload\" class=\"browser-control\" disabled>Reload</button><input id=\"address\" type=\"text\" aria-label=\"Website address\" placeholder=\"Enter a website URL\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"browser-control\" disabled>Go</button><button type=\"button\" id=\"new-tab\" class=\"browser-control\" disabled>+ New tab</button></form><nav id=\"tabs\" aria-label=\"Browser tabs\"></nav><main><canvas id=\"screen\" tabindex=\"0\" aria-label=\"Live browser screen\"></canvas></main><footer>Same Chromium as ChatGPT \u00b7 Control is shared: pause ChatGPT before typing \u00b7 Access expires after 8 hours</footer><script src=\"/client.js\"></script></html>\n"
