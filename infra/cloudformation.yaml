    # END GENERATED VIEWER METADATA
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !If
        - UseArm64
        - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
        - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64}}'
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            DeleteOnTermination: true
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-browser'
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          work=/tmp/playwright-mcp-aws
          mkdir -p "$work/scripts"
          dnf install -y aws-cfn-bootstrap
          /opt/aws/bin/cfn-init -v --stack '${AWS::StackName}' --resource BrowserInstance --region '${AWS::Region}'

          printf '%s' '' | base64 -d > "$work/runtime.tgz"
          tar -xzf "$work/runtime.tgz" -C "$work"
          rm -f "$work/runtime.tgz"
          chmod +x "$work/scripts/start.sh" "$work/scripts/bootstrap.sh"

          export OPENAI_TUNNEL_ID='${TunnelId}'
          export SSM_API_KEY_PARAMETER='${RuntimeApiKeyParameterName}'
          export PLAYWRIGHT_MCP_IMAGE='${PlaywrightMcpImage}'
          export TUNNEL_CLIENT_IMAGE='${TunnelClientImage}'
          export DOCKER_COMPOSE_VERSION='${DockerComposeVersion}'
          "$work/scripts/bootstrap.sh"

Outputs:
  InstanceId:
    Value: !Ref BrowserInstance
  VpcId:
    Value: !Ref Vpc
  SecurityGroupId:
    Value: !Ref SecurityGroup
  SsmStartSessionCommand:
    Value: !Sub 'aws ssm start-session --target ${BrowserInstance}'
