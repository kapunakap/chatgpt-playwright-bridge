server {
    listen 8931;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location = /compat-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Playwright MCP returns 400 for these absent OAuth metadata endpoints.
    # tunnel-client's no-auth discovery path expects 404 for absent metadata.
    location = /.well-known/oauth-protected-resource {
        return 404;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        return 404;
    }

    location / {
        set $playwright_upstream http://playwright:8931;
        proxy_pass $playwright_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host playwright:8931;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
